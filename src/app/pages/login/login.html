<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title class="brand-title">InvenMax IA</mat-card-title>
      <mat-card-subtitle>Login</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="form-content">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" [(ngModel)]="email" placeholder="ejemplo@invenmax.com" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" [(ngModel)]="password" placeholder="Ingresar contraseña"  required>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions class="actions-container">
      <!-- (click) ejecuta la función hacerLogin() de nuestro TypeScript -->
      <button mat-raised-button color="primary" class="btn-block" (click)="hacerLogin()">
        Ingresar al Sistema
      </button>
    </mat-card-actions>
  </mat-card>
</div>
