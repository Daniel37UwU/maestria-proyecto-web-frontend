<div class="dashboard-container">
  <!-- Barra de navegación superior (Conservada y Modificada) -->
  <mat-toolbar color="primary" class="navbar">
    <span class="logo-text">
      <mat-icon class="icon-align">leaderboard</mat-icon>
      InvenMax IA
    </span>
    
    <div style="display: flex; gap: 12px; align-items: center;"></div>
      <!-- Proyecto InvenMax -->
      <button mat-button (click)="irAlProyecto()"  style="color: #ffffff; font-weight: bold;">
        <mat-icon>home</mat-icon>
        Inicio (Mi Proyecto)
      </button>

      
      <!-- Cerrar Sesión -->
      <button mat-flat-button class="logout-btn" (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
        Cerrar Sesión
      </button>
  </mat-toolbar>

  <!-- Área de Contenido de la Guía Práctica -->
  <main class="content-area" style="padding: 24px; background-color: #f8f9fa;">
    
    <div style="padding: 20px;">
      <mat-card class="ai-card">
        <mat-card-header>
          <mat-card-title>Asistente Inteligente (SaaS AI)</mat-card-title>
        </mat-card-header>
        
        <mat-card-content style="margin-top: 15px;">
          <mat-form-field appearance="outline" style="width: 100%;">
            <mat-label>Escribe un texto o consulta para analizar...</mat-label>
            <input matInput [(ngModel)]="textoUsuario" placeholder="Ej. Analiza este reporte de ventas...">
          </mat-form-field>
          
          <button mat-raised-button color="primary" (click)="enviarPregunta()" [disabled]="cargando">
            Procesar con IA
          </button>
          
          <!-- Estado de carga -->
          <div *ngIf="cargando" style="margin-top: 20px; display: flex; align-items: center; gap: 10px;">
            <mat-spinner diameter="30"></mat-spinner>
            <span>El cerebro está pensando...</span>
          </div>
          
          <!-- Resultado -->
          <div *ngIf="respuestaIA" style="margin-top: 20px; background: #f5f5f5; padding: 15px; border-radius: 8px;">
            <strong>Respuesta del Sistema:</strong>
            <p style="margin-top: 5px; white-space: pre-line;">{{ respuestaIA }}</p>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

  </main>
</div>
