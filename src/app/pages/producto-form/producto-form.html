<h2 mat-dialog-title class="dialog-title">
  <mat-icon>{{ data.producto ? 'edit' : 'add_shopping_cart' }}</mat-icon>
  {{ data.producto ? 'Modificar Producto' : 'Agregar Nuevo Producto' }}
</h2>

<form [formGroup]="productoForm" (ngSubmit)="guardar()">
  <mat-dialog-content class="dialog-content">
    
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre del Producto</mat-label>
        <input matInput formControlName="nombre" placeholder="Ej. Teclado Mecánico RGB">
      </mat-form-field>
    </div>

    <div class="form-row split">
      <mat-form-field appearance="outline">
        <mat-label>Categoría</mat-label>
        <input matInput formControlName="categoria" placeholder="Ej. Electrónica">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Precio de Venta</mat-label>
        <input matInput type="number" formControlName="precioVenta" placeholder="0.00">
        <span matPrefix>$&nbsp;</span>
      </mat-form-field>
    </div>

    <div class="form-row split">
      <mat-form-field appearance="outline">
        <mat-label>Costo de Adquisición</mat-label>
        <input matInput type="number" formControlName="costoAdquisicion" placeholder="0.00">
        <span matPrefix>$&nbsp;</span>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Unidades Vendidas</mat-label>
        <input matInput type="number" formControlName="unidadesVendidas" placeholder="0">
      </mat-form-field>
    </div>

    <div class="form-row split">
      <mat-form-field appearance="outline">
        <mat-label>Stock Actual</mat-label>
        <input matInput type="number" formControlName="stockActual" placeholder="0">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Stock Mínimo</mat-label>
        <input matInput type="number" formControlName="stockMinimo" placeholder="0">
      </mat-form-field>
    </div>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-raised-button class="btn-save" [disabled]="productoForm.invalid">
      <mat-icon>save</mat-icon> Guardar
    </button>
  </mat-dialog-actions>
</form>
